{%- comment -%} Usage: {% include video.html name="01-detect-release" title="A release is detected" poster="capture-results.jpg" %} {%- endcomment -%}
{%- assign base = '/assets/videos/' | append: include.name | relative_url -%}
<figure class="video">
  <video controls preload="metadata" playsinline aria-label="{{ include.title }}"{% if include.poster %} poster="{{ '/assets/images/' | append: include.poster | relative_url }}"{% endif %}>
    <source src="{{ base }}.mp4" type="video/mp4">
    <track kind="captions" srclang="en" label="English" default src="{{ base }}.vtt">
    Your browser can't play this video. <a href="{{ base }}.mp4">Download it</a>.
  </video>
  <figcaption><span class="video-label">Video</span>{{ include.title }} · captions on · <a href="{{ base }}.vtt">transcript</a></figcaption>
</figure>

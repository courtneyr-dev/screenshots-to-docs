title: P1 screenshots to docs
description: Keep P1 docs screenshots current across releases, from capture to annotated Figma frames to every doc.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
color_scheme: pantheon
enable_copy_code_button: true
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: yellow
  tip:
    title: Tip
    color: green
search_enabled: true
heading_anchors: true
mermaid:
  version: "12.1.0"
back_to_top: true
nav_external_links: []
exclude:
  - "*.vtt.srt"
